# Sibling cellpose4 environment.
# Hosts cellpose 4.x for cpsam (ViT) inference. Invoked from the main
# `cellpose` env via `conda run -n cellpose4 python -c …` whenever the
# pipeline needs the cpsam_dic model — see core/hybrid_dic.py and
# core/hybrid_cpsam.py.
#
# Install:
#   conda env create -f environment-cellpose4.yml
#
# Minimal deps: only what cpsam inference needs. No GUI here.
name: cellpose4
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    - cellpose==4.1.1
    - torch==2.7.0
    - torchvision==0.22.0
    - numpy==2.0.2
    - tifffile>=2023.2.28
    - psutil
    # core/medsam_deepsea_union.py:_deepsea_predict needs skimage.
    # cellpose 4.x doesn't pull it in transitively the way cellpose
    # 3.x did, so we add it explicitly. Caught on the IC295 mini
    # batch run (2026-05-26) — DeepSea per-cell refinement crashed
    # with ModuleNotFoundError: skimage.
    - scikit-image>=0.25
